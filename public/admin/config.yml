                widget: string
                hint: 'HTML simple accepté : <br>, <span class="serif-it">…</span>.'
              - { name: lede, label: Chapeau, widget: text }
              - { name: soonLabel, label: Étiquette « prochainement », widget: string }
              - name: basics
