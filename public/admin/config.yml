          - name: meta
            label: Référencement (Google, partages)
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Titre de la page, widget: string }
              - name: description
                label: Description
                widget: text
                hint: Environ 150 à 160 caractères. Sert aussi d'aperçu lors des partages.
          - name: hero
            label: En-tête (haut de page)
            widget: object
            fields:
              - { name: pill, label: Pastille, widget: string }
              - { name: eyebrow, label: Surtitre, widget: string }
              - name: title
                label: Titre principal
                widget: string
                hint: 'HTML simple accepté : <br> pour un retour à la ligne, <span class="em-serif">mot</span> pour mettre un mot en italique serif.'
              - { name: lede, label: Chapeau, widget: text }
              - { name: ctaLabel, label: Libellé du bouton, widget: string }
              - name: highlights
                label: Arguments sous le bouton
                widget: list
                field: { name: item, label: Argument, widget: string }
          - name: features
            label: Section « Ce qui change pour vous »
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Surtitre, widget: string }
              - name: title
